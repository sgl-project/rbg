# Test-only webhooks; envtest rewrites their clientConfig and caBundle for its local server.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mrolebasedgroup.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-workloads-x-k8s-io-v1alpha2-rolebasedgroup
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroups
- name: mrolebasedgroupset.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-workloads-x-k8s-io-v1alpha2-rolebasedgroupset
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroupsets
- name: mroleinstanceset.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-workloads-x-k8s-io-v1alpha2-roleinstanceset
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - roleinstancesets
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: rbgset-validating-webhook-configuration
webhooks:
- name: vrolebasedgroupset.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha2-rolebasedgroupset
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroupsets
