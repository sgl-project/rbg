apiVersion: v1
kind: ConfigMap
metadata:
  name: rbgs-prometheus-configmap
  # Adjust to the namespace where your Prometheus instance runs.
  namespace: monitoring
data:
  prometheus.yml: |-
    global:
      scrape_interval: 30s
    scrape_configs:
    - job_name: 'rbgs-controller'
      # The RBG controller serves metrics over HTTPS on the
      # --metrics-bind-address port (8443 by default). Requests are
      # authenticated (TokenReview) and authorized (SubjectAccessReview)
      # by the controller, so Prometheus must present its own service
      # account token. See rbac.yaml for the required ClusterRole.
      # If the controller runs with --metrics-secure=false or
      # --enable-webhooks=none, metrics are served over plain HTTP;
      # change scheme to http in that case (see README.md).
      scheme: https
      metrics_path: /metrics
      authorization:
        credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config:
        # The metrics server uses a self-signed certificate unless
        # --metrics-cert-path is configured. Point ca_file at the right
        # CA (or set insecure_skip_verify: false) when you provision
        # certificates for the metrics server.
        insecure_skip_verify: true
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
      # Only scrape rbgs-controller-manager pods. The metrics port is not
      # declared as a container port, so rebuild __address__ from the pod IP.
      - source_labels: [__meta_kubernetes_pod_label_control_plane]
        regex: rbgs-controller
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        regex: (.+)
        target_label: __address__
        replacement: $1:8443
        action: replace
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
        replacement: $1
        action: replace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
        replacement: $1
        action: replace
