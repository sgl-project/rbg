version: "2"
run:
  timeout: 5m
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
    goconst:
      # Repeated literals in tests (fixtures, expected values) are acceptable.
      ignore-tests: true
    staticcheck:
      # Ginkgo/Gomega are idiomatically dot-imported in the test suites.
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
        - github.com/onsi/gomega
  exclusions:
    # Intentionally no `presets:` here - keep golangci's default exclusion set
    # off so the project continues to see all findings (matching the old
    # `exclude-use-default: false`).
    generated: lax
    rules:
      - linters:
          - dupl
        path: ^internal/
      - linters:
          - dupl
        path: ^test/
      - linters:
          - dupl
        path: ^cmd/cli/cmd/llm/config/
      # Table-driven cases and inline fixtures are legitimately repetitive, and
      # keeping each case readable standalone beats extracting shared helpers.
      # Same rationale as goconst.ignore-tests above.
      - linters:
          - dupl
        path: _test\.go$
      # Test helper files under test/ that are not *_test.go (fixtures,
      # wrappers) also repeat literals; ignore-tests above only covers
      # *_test.go files.
      - linters:
          - goconst
        path: ^test/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
