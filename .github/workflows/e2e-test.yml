name: E2E Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: 1.26.6
  GOTOOLCHAIN: local
  KIND_VERSION: v0.31.0
  KUBERNETES_VERSION: v1.31.12
  VOLCANO_VERSION: v1.15.1
  LWS_VERSION: v0.7.0
  SCHEDULER_PLUGINS_VERSION: v0.32.7
  E2E_IMAGE_TAG: e2e-ci

permissions: read-all

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Check if changes require e2e tests
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD^1"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_REF" HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          CODE_PATTERNS='\.go$|^Makefile|^Dockerfile|go\.mod|go\.sum|\.sh$|^config/crd/|^config/rbac/|^deploy/helm/|^deploy/kubectl/|^\.github/workflows/|^\.github/actions/|^test/'
          SKIP_DIRS='^(examples|doc|python)/'

          SHOULD_RUN="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RUN="true"
          elif [ -n "$CHANGED_FILES" ]; then
            NON_SKIP_FILES=$(echo "$CHANGED_FILES" | grep -vE "$SKIP_DIRS" || true)
            if [ -z "$NON_SKIP_FILES" ]; then
              echo "All changed files are in skip directories ($SKIP_DIRS). Skipping e2e tests."
            else
              CODE_FILES=$(echo "$NON_SKIP_FILES" | grep -E "$CODE_PATTERNS" || true)
              if [ -n "$CODE_FILES" ]; then
                echo "Found code/config files that require e2e tests:"
                echo "$CODE_FILES"
                SHOULD_RUN="true"
              else
                echo "All changed files are non-code files. Skipping e2e tests."
              fi
            fi
          else
            SHOULD_RUN="true"
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build E2E images
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build controller and CRD upgrader images
        run: |
          make manifests
          make docker-build-controller TAG="${{ env.E2E_IMAGE_TAG }}"
          make docker-build-crd-upgrader TAG="${{ env.E2E_IMAGE_TAG }}"
          docker images | grep -E 'rbgs-controller|rbgs-upgrade-crd' || true

      - name: Save E2E image archive
        run: |
          mkdir -p _artifacts/e2e-images
          docker save \
            "docker.io/rolebasedgroup/rbgs-controller:${{ env.E2E_IMAGE_TAG }}" \
            "docker.io/rolebasedgroup/rbgs-upgrade-crd:${{ env.E2E_IMAGE_TAG }}" \
            -o _artifacts/e2e-images/images.tar

      - name: Upload E2E image archive
        uses: actions/upload-artifact@v4
        with:
          name: e2e-images
          path: _artifacts/e2e-images/images.tar
          retention-days: 1
          if-no-files-found: error

  e2e-matrix:
    name: E2E ${{ matrix.group }}
    needs:
      - check-changes
      - build-images
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lifecycle
            filter: "lifecycle && !volcano && !scheduler-plugins && !v1alpha1"
            timeout_minutes: 25
          - group: workload
            filter: "workload && !volcano && !scheduler-plugins && !v1alpha1"
            timeout_minutes: 30
          - group: update
            filter: "(update && !rollout) && !volcano && !scheduler-plugins && !v1alpha1"
            timeout_minutes: 35
          - group: rollout
            filter: "rollout && !volcano && !scheduler-plugins && !v1alpha1"
            timeout_minutes: 40
          - group: feature
            filter: "(feature && !rollout) && !volcano && !scheduler-plugins && !v1alpha1"
            timeout_minutes: 35
          - group: webhook-rbac
            filter: "(webhook || rbac) && !volcano && !scheduler-plugins && !v1alpha1"
            timeout_minutes: 25
          - group: scheduler
            filter: "scheduler && !volcano && !scheduler-plugins && !v1alpha1"
            timeout_minutes: 35
          - group: v1alpha1
            filter: "v1alpha1"
            timeout_minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Download E2E images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: _artifacts/e2e-images

      - name: Setup Kind and RBGS
        uses: ./.github/actions/setup-e2e-cluster
        with:
          cluster_name: rbgs-${{ matrix.group }}-e2e
          install_mode: helm
          image_tag: ${{ env.E2E_IMAGE_TAG }}
          scheduler: default
          port_allocator_enabled: "true"
          kubernetes_version: ${{ env.KUBERNETES_VERSION }}
          kind_version: ${{ env.KIND_VERSION }}
          lws_version: ${{ env.LWS_VERSION }}

      - name: Run E2E ${{ matrix.group }} slice
        run: |
          make test-e2e \
            E2E_LABEL_FILTER='${{ matrix.filter }}' \
            E2E_TIMEOUT=${{ matrix.timeout_minutes }}m \
            E2E_FAIL_FAST=false

      - name: Collect diagnostics
        if: failure()
        run: |
          echo "=== Controller logs ==="
          kubectl logs -n rbgs-system -l control-plane=rbgs-controller --tail=300 || true
          echo "=== Controller pod ==="
          kubectl describe pods -n rbgs-system -l control-plane=rbgs-controller || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -100 || true
          kind export logs "/tmp/kind-${{ matrix.group }}-logs" --name "rbgs-${{ matrix.group }}-e2e" || true

      - name: Upload Ginkgo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group }}-reports
          path: test/e2e/artifacts
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Kind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group }}-kind-logs
          path: /tmp/kind-${{ matrix.group }}-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: kind delete cluster --name "rbgs-${{ matrix.group }}-e2e" || true

  e2e-manifest:
    name: Manifest installation e2e
    needs:
      - check-changes
      - build-images
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Download E2E images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: _artifacts/e2e-images

      - name: Setup Kind and RBGS from committed manifests
        uses: ./.github/actions/setup-e2e-cluster
        with:
          cluster_name: rbgs-manifest-e2e
          install_mode: manifest
          image_tag: ${{ env.E2E_IMAGE_TAG }}
          scheduler: default
          port_allocator_enabled: "true"
          kubernetes_version: ${{ env.KUBERNETES_VERSION }}
          kind_version: ${{ env.KIND_VERSION }}
          lws_version: ${{ env.LWS_VERSION }}

      - name: Run manifest installation e2e
        run: |
          make test-e2e \
            E2E_LABEL_FILTER='(smoke || install || rbac || webhook) && !volcano && !scheduler-plugins && !v1alpha1' \
            E2E_TIMEOUT=20m \
            E2E_FAIL_FAST=false

      - name: Collect diagnostics
        if: failure()
        run: |
          echo "=== Controller logs ==="
          kubectl logs -n rbgs-system -l control-plane=rbgs-controller --tail=300 || true
          echo "=== Controller pod ==="
          kubectl describe pods -n rbgs-system -l control-plane=rbgs-controller || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -100 || true
          kind export logs /tmp/kind-manifest-logs --name rbgs-manifest-e2e || true

      - name: Upload Ginkgo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-manifest-reports
          path: test/e2e/artifacts
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Kind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-manifest-kind-logs
          path: /tmp/kind-manifest-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: kind delete cluster --name rbgs-manifest-e2e || true

  e2e-deprecated-disabled:
    name: Deprecated workloads disabled e2e
    needs:
      - check-changes
      - build-images
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Download E2E images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: _artifacts/e2e-images

      - name: Setup Kind and RBGS with deprecated workloads disabled
        uses: ./.github/actions/setup-e2e-cluster
        with:
          cluster_name: rbgs-deprecated-e2e
          install_mode: helm
          image_tag: ${{ env.E2E_IMAGE_TAG }}
          scheduler: default
          deprecated_workload_types_disabled: "true"
          kubernetes_version: ${{ env.KUBERNETES_VERSION }}
          kind_version: ${{ env.KIND_VERSION }}
          lws_version: ${{ env.LWS_VERSION }}

      - name: Run deprecated-disabled e2e
        run: make test-e2e-deprecated-disabled

      - name: Collect diagnostics
        if: failure()
        run: |
          echo "=== Controller logs ==="
          kubectl logs -n rbgs-system -l control-plane=rbgs-controller --tail=300 || true
          echo "=== Controller pod ==="
          kubectl describe pods -n rbgs-system -l control-plane=rbgs-controller || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -100 || true
          kind export logs /tmp/kind-deprecated-logs --name rbgs-deprecated-e2e || true

      - name: Upload Ginkgo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-deprecated-reports
          path: test/e2e/apicompat/artifacts
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Kind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-deprecated-kind-logs
          path: /tmp/kind-deprecated-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: kind delete cluster --name rbgs-deprecated-e2e || true

  e2e-volcano-gang:
    name: Volcano gang scheduling e2e
    needs:
      - check-changes
      - build-images
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Download E2E images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: _artifacts/e2e-images

      - name: Setup Kind, Volcano, and RBGS
        uses: ./.github/actions/setup-e2e-cluster
        with:
          cluster_name: rbgs-volcano-e2e
          install_mode: helm
          image_tag: ${{ env.E2E_IMAGE_TAG }}
          scheduler: volcano
          kubernetes_version: ${{ env.KUBERNETES_VERSION }}
          kind_version: ${{ env.KIND_VERSION }}
          lws_version: ${{ env.LWS_VERSION }}
          volcano_version: ${{ env.VOLCANO_VERSION }}

      - name: Run Volcano gang scheduling e2e
        run: make test-e2e-volcano

      - name: Collect diagnostics
        if: failure()
        run: |
          echo "=== Controller logs ==="
          kubectl logs -n rbgs-system -l control-plane=rbgs-controller --tail=300 || true
          echo "=== Volcano logs ==="
          kubectl logs -n volcano-system -l app=volcano-scheduler --tail=300 || true
          echo "=== PodGroups ==="
          kubectl get podgroups.scheduling.x-k8s.io -A -o yaml || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -100 || true
          kind export logs /tmp/kind-volcano-logs --name rbgs-volcano-e2e || true

      - name: Upload Ginkgo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-volcano-reports
          path: test/e2e/artifacts
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Kind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-volcano-kind-logs
          path: /tmp/kind-volcano-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: kind delete cluster --name rbgs-volcano-e2e || true

  e2e-scheduler-plugins-gang:
    name: scheduler-plugins gang scheduling e2e
    needs:
      - check-changes
      - build-images
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Download E2E images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: _artifacts/e2e-images

      - name: Setup Kind, scheduler-plugins, and RBGS
        uses: ./.github/actions/setup-e2e-cluster
        with:
          cluster_name: rbgs-sp-e2e
          install_mode: helm
          image_tag: ${{ env.E2E_IMAGE_TAG }}
          scheduler: scheduler-plugins
          scheduler_profile_name: scheduler-plugins-scheduler
          kubernetes_version: ${{ env.KUBERNETES_VERSION }}
          kind_version: ${{ env.KIND_VERSION }}
          lws_version: ${{ env.LWS_VERSION }}
          scheduler_plugins_version: ${{ env.SCHEDULER_PLUGINS_VERSION }}

      - name: Run scheduler-plugins gang scheduling e2e
        run: make test-e2e-scheduler-plugins

      - name: Collect diagnostics
        if: failure()
        run: |
          echo "=== Controller logs ==="
          kubectl logs -n rbgs-system -l control-plane=rbgs-controller --tail=300 || true
          echo "=== scheduler-plugins logs ==="
          kubectl logs -n scheduler-plugins -l app=scheduler-plugins-scheduler --tail=300 || true
          echo "=== PodGroups ==="
          kubectl get podgroups.scheduling.x-k8s.io -A -o yaml || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -100 || true
          kind export logs /tmp/kind-sp-logs --name rbgs-sp-e2e || true

      - name: Upload Ginkgo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scheduler-plugins-reports
          path: test/e2e/artifacts
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Kind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scheduler-plugins-kind-logs
          path: /tmp/kind-sp-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: kind delete cluster --name rbgs-sp-e2e || true
