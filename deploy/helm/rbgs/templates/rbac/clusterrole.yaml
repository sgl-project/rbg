{{- $features := .Values.controller.features | default dict -}}
{{- $v1alpha1Compat := $features.v1alpha1Compat | default dict -}}
{{- $compatEnabled := true -}}
{{- if hasKey $v1alpha1Compat "enabled" }}
{{- $compatEnabled = $v1alpha1Compat.enabled }}
{{- end }}
---
# NOTE: This file is manually maintained with Helm conditionals for v1alpha1
# indirect workload permissions. Keep it in sync with config/rbac/role.yaml
# (generated by controller-gen from kubebuilder annotations). When adding new
# permissions to the controller, update both files.
#
# v1alpha1Compat defaults to true (enabled). The variable above resolves
# the effective value with nil-safety so that upgrades from older values.yaml
# files that don't define controller.features.v1alpha1Compat still include
# the indirect workload RBAC permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rbgs-controller-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - patch
  - watch
# controllerrevisions is always required for revision management.
- apiGroups:
  - apps
  resources:
  - controllerrevisions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - controllerrevisions/status
  verbs:
  - get
  - patch
  - update
{{- if $compatEnabled }}
# v1alpha1 indirect workload permissions (Deployment, StatefulSet) — only included when
# controller.features.v1alpha1Compat.enabled is true (default).
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments/status
  - statefulsets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments/finalizers
  - statefulsets/finalizers
  verbs:
  - update
{{- end }}
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- if $compatEnabled }}
# v1alpha1 indirect workload permissions (LeaderWorkerSet) — only included when
# controller.features.v1alpha1Compat.enabled is true (default).
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets/status
  verbs:
  - get
  - patch
  - update
{{- end }}
- apiGroups:
  - scheduling.volcano.sh
  - scheduling.x-k8s.io
  resources:
  - podgroups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloads.x-k8s.io
  resources:
  - clusterengineruntimeprofiles
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloads.x-k8s.io
  resources:
  - clusterengineruntimeprofiles/status
  - coordinatedpolicies/status
  - instances/status
  - instancesets/status
  - rolebasedgroups/status
  - rolebasedgroupscalingadapters/status
  - rolebasedgroupsets/status
  - rolebasedgroupwarmups/status
  - roleinstances/status
  - roleinstancesets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - workloads.x-k8s.io
  resources:
  - coordinatedpolicies
  - instances
  - instancesets
  - rolebasedgroups
  - rolebasedgroupscalingadapters
  - rolebasedgroupsets
  - rolebasedgroupwarmups
  - roleinstances
  - roleinstancesets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloads.x-k8s.io
  resources:
  - instancesets/finalizers
  - rolebasedgroups/finalizers
  - rolebasedgroupsets/finalizers
  - rolebasedgroupwarmups/finalizers
  - roleinstances/finalizers
  - roleinstancesets/finalizers
  verbs:
  - update
