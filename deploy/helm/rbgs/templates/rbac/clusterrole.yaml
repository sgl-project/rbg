---
{{- /*
  deprecatedWorkloadTypes.enabled gates the RBAC for the deprecated workload types.
  Treat an unset value as enabled, matching values.yaml, so a partial controller
  override cannot silently strip these permissions.
*/}}
{{- $deprecatedWorkloadTypes := .Values.controller.deprecatedWorkloadTypes | default dict }}
{{- $deprecatedEnabled := or (not (hasKey $deprecatedWorkloadTypes "enabled")) $deprecatedWorkloadTypes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rbgs-controller-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apps
  resources:
  - controllerrevisions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - controllerrevisions/status
  verbs:
  - get
  - patch
  - update
{{- if $deprecatedEnabled }}
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments/status
  - statefulsets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments/finalizers
  - statefulsets/finalizers
  verbs:
  - update
{{- end }}
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- if $deprecatedEnabled }}
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets/status
  verbs:
  - get
  - patch
  - update
{{- end }}
- apiGroups:
  - scheduling.volcano.sh
  - scheduling.x-k8s.io
  resources:
  - podgroups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloads.x-k8s.io
  resources:
  - clusterengineruntimeprofiles
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloads.x-k8s.io
  resources:
  - clusterengineruntimeprofiles/status
  - coordinatedpolicies/status
  - instances/status
  - instancesets/status
  - rolebasedgroups/status
  - rolebasedgroupscalingadapters/status
  - rolebasedgroupsets/status
  - rolebasedgroupwarmups/status
  - roleinstances/status
  - roleinstancesets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - workloads.x-k8s.io
  resources:
  - coordinatedpolicies
  - instances
  - instancesets
  - rolebasedgroups
  - rolebasedgroupscalingadapters
  - rolebasedgroupsets
  - rolebasedgroupwarmups
  - roleinstances
  - roleinstancesets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloads.x-k8s.io
  resources:
  - instancesets/finalizers
  - rolebasedgroups/finalizers
  - rolebasedgroupsets/finalizers
  - rolebasedgroupwarmups/finalizers
  - roleinstances/finalizers
  - roleinstancesets/finalizers
  verbs:
  - update
