apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbgs-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: rbgs-controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      control-plane: rbgs-controller
  template:
    metadata:
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        control-plane: rbgs-controller
    spec:
      {{- with .Values.controller.imagePullSecrets | default (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: rbgs-controller-sa
      # The preStop sleep delays SIGTERM by 5s, so the webhooks keep serving
      # while the Pod leaves the webhook Service's endpoints. The grace period
      # covers that sleep plus the manager's 30s graceful shutdown (5 + 30).
      terminationGracePeriodSeconds: 35
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          {{- $pprof := .Values.controller.pprof | default dict }}
          args:
            - --metrics-bind-address=:8443
            - --leader-elect
            - --health-probe-bind-address=:8081
            {{- $podCacheScope := .Values.controller.podCacheScope }}
            {{- if ne $podCacheScope nil }}
            {{- if not (has $podCacheScope (list "all" "filtered")) }}
            {{- fail "controller.podCacheScope must be all or filtered" }}
            {{- end }}
            - --pod-cache-scope={{ $podCacheScope }}
            {{- end }}
            {{- if ne .Values.controller.watchListClient nil }}
            {{- $watchListClient := .Values.controller.watchListClient | toString }}
            {{- if not (has $watchListClient (list "true" "false")) }}
            {{- fail "controller.watchListClient must be true or false" }}
            {{- end }}
            - --watch-list-client={{ $watchListClient }}
            {{- end }}
            {{- if .Values.controller.tuning }}
            - --max-concurrent-reconciles={{ .Values.controller.tuning.maxConcurrentReconciles | default 10 }}
            - --kube-api-qps={{ .Values.controller.tuning.kubeApiQPS | default 20 }}
            - --kube-api-burst={{ .Values.controller.tuning.kubeApiBurst | default 30 }}
            {{- end }}
            {{- $features := .Values.controller.features | default dict }}
            {{- $portAllocator := $features.portAllocator | default dict }}
            {{- if $portAllocator.enabled }}
            - --enable-port-allocator=true
            - --port-allocate-strategy={{ $portAllocator.strategy | default "random" }}
            - --start-port={{ $portAllocator.startPort | default 30000 }}
            - --port-range={{ $portAllocator.portRange | default 5000 }}
            {{- end }}
            {{- $gangScheduling := $features.gangScheduling | default dict }}
            - --scheduler-name={{ $gangScheduling.schedulerName | default "scheduler-plugins" }}
            {{- with $gangScheduling.schedulerProfileName }}
            - --scheduler-profile-name={{ . }}
            {{- end }}
            {{- $deprecatedWorkloadTypes := .Values.controller.deprecatedWorkloadTypes | default dict }}
            {{- $deprecatedEnabled := or (not (hasKey $deprecatedWorkloadTypes "enabled")) $deprecatedWorkloadTypes.enabled }}
            {{- if $deprecatedEnabled }}
            - --enable-deprecated-workload-types=true
            {{- else }}
            - --enable-deprecated-workload-types=false
            {{- end }}
            {{- if $pprof.enabled }}
            - --enable-pprof=true
            - --pprof-bind-address={{ $pprof.bindAddress | default ":6060" }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /manager
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy | default "IfNotPresent" }}
          {{- if $pprof.enabled }}
          ports:
            - name: pprof
              containerPort: {{ $pprof.containerPort | default 6060 }}
              protocol: TCP
          {{- end }}
          lifecycle:
            # Needs /bin/sleep in the image. Switch to preStop.sleep once
            # Kubernetes 1.30 is the minimum.
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
