{{ if .Values.crdUpgrade.enabled -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace }}
  name: rbgs-crds-upgrade-{{ replace "." "" .Chart.AppVersion }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
{{- if .Values.crdUpgrade.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.crdUpgrade.ttlSecondsAfterFinished }}
{{- end }}
  backoffLimit: 3
  template:
    spec:
      {{- with .Values.crdUpgrade.imagePullSecrets | default (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.crdUpgrade.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.crdUpgrade.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: rbgs-crds-upgrade
      containers:
        - name: rbgs-crds-upgrade
          image: "{{ .Values.crdUpgrade.image.repository }}:{{ .Values.crdUpgrade.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.crdUpgrade.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: WEBHOOK_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: WEBHOOK_SERVICE
              value: "rbgs-webhook-service"
      restartPolicy: OnFailure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rbgs-crds-upgrade
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
rules:
  # "create" cannot be scoped by resourceNames: the object name lives in the
  # request body, so it is not available to the authorizer.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create"]
  # Named access is restricted to the CRDs shipped in this chart.
  # Keep in sync with config/crd/bases (baked into the upgrade image).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "update", "patch"]
    resourceNames:
      - clusterengineruntimeprofiles.workloads.x-k8s.io
      - coordinatedpolicies.workloads.x-k8s.io
      - instances.workloads.x-k8s.io
      - instancesets.workloads.x-k8s.io
      - rolebasedgroups.workloads.x-k8s.io
      - rolebasedgroupscalingadapters.workloads.x-k8s.io
      - rolebasedgroupsets.workloads.x-k8s.io
      - rolebasedgroupwarmups.workloads.x-k8s.io
      - roleinstances.workloads.x-k8s.io
      - roleinstancesets.workloads.x-k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rbgs-crds-upgrade
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rbgs-crds-upgrade
subjects:
  - kind: ServiceAccount
    name: rbgs-crds-upgrade
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rbgs-crds-upgrade
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
{{- end }}
