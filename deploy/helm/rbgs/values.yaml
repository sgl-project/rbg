# Default values for rbgs-controller.

global:
  # imagePullSecrets is shared by the controller Deployment and the crd-upgrade Job.
  imagePullSecrets: []

controller:
  # Leave unset to use the image's defaults (all and false in Alpha).
  podCacheScope: null
  watchListClient: null
  replicaCount: 2
  # imagePullSecrets overrides global.imagePullSecrets for the controller when set.
  imagePullSecrets: []
  image:
    repository: rolebasedgroup/rbgs-controller
    tag: "v0.9.0-45e6e1c2"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # topologySpreadConstraints for the controller pods. By default the scheduler
  # prefers a different node for each replica but never blocks scheduling
  # (ScheduleAnyway). Set to [] to remove the default.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          control-plane: rbgs-controller
  # podDisruptionBudget limits voluntary evictions, such as node drains, to
  # one Ready controller pod at a time (maxUnavailable: 1). Pods that are not
  # Ready can always be evicted. With replicaCount above 1 on a single-node
  # cluster, a drain therefore evicts one pod and then waits, because its
  # replacement cannot schedule on the cordoned node: set enabled: false, or
  # drain with `kubectl drain --disable-eviction`, to take that node down.
  # With replicaCount: 1 the budget allows evicting the only pod, so neither
  # is needed.
  podDisruptionBudget:
    enabled: true
  podAnnotations: {}
  podSecurityContext: {}
  # fsGroup: 2000
  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  # tuning holds controller runtime tuning parameters.
  tuning:
    # The number of concurrent reconcile workers per controller.
    maxConcurrentReconciles: 10
    # Maximum QPS from the controller to the Kubernetes API server.
    # Increase for large-scale deployments to avoid client-side throttling.
    kubeApiQPS: 20
    # Maximum burst for throttle from the controller to the Kubernetes API server.
    # Should be set higher than kubeApiQPS.
    kubeApiBurst: 30
  # pprof holds the pprof profiling server configuration.
  # When enabled, exposes pprof endpoints for performance debugging.
  pprof:
    enabled: false
    # The address the pprof endpoint binds to.
    bindAddress: ":6060"
    # The container port exposed for pprof (used in pod spec).
    containerPort: 6060
  # features holds controller feature flags passed to /manager.
  features:
    # gangScheduling configures the gang scheduling scheduler.
    gangScheduling:
      # schedulerName selects the gang scheduling scheduler: scheduler-plugins | volcano.
      schedulerName: scheduler-plugins
      # schedulerProfileName is the kube-scheduler profile running the coscheduling
      # plugin, injected as pod.spec.schedulerName for gang-scheduled pods. Only used
      # with schedulerName=scheduler-plugins; the upstream chart uses
      # scheduler-plugins-scheduler. Leave empty when scheduler-plugins is the
      # cluster's default scheduler or the role template sets schedulerName itself.
      schedulerProfileName: ""
    # portAllocator configures dynamic port allocation to pods.
    portAllocator:
      # Whether to enable the port allocator feature.
      enabled: false
      # Port allocation strategy. Supported values: random.
      strategy: random
      # The starting port number of the allocatable port range.
      startPort: 30000
      # The size of the allocatable port range.
      portRange: 5000
  # deprecatedWorkloadTypes controls compatibility for existing deprecated
  # workload types (Deployment, StatefulSet, LeaderWorkerSet), superseded by
  # RoleInstanceSet.
  # Recommended: false for new installations and for clusters where migration
  # is complete: no deprecated role remains, reconciliation has finished, and
  # the old RBG-owned workloads are gone. Keep true while cleanup is pending:
  # existing roles keep their own type and can be migrated one at a time, while
  # new uses — including switching between deprecated types — are rejected.
  # With false, every remaining use is rejected and legacy RBAC/watches are off.
  deprecatedWorkloadTypes:
    enabled: true

podLabelMigration:
  # Opt in to migration on upgrades with a controller image that includes /kubectl-rbg.
  enabled: false
  rateLimit: 10
  timeout: 2m
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 259200

crdUpgrade:
  # Whether to enable CRD Upgrader Job (runs before install/upgrade)
  enabled: true
  # Time-to-live (TTL) for crd-upgrade jobs after completion. Default is 259200 seconds (3 days).
  ttlSecondsAfterFinished: 259200
  # Number of retries before considering the crd-upgrade Job failed. Default is 3.
  backoffLimit: 3
  # imagePullSecrets overrides global.imagePullSecrets for the crd-upgrade Job when set.
  imagePullSecrets: []
  # CRD Upgrader image configuration
  image:
    repository: rolebasedgroup/rbgs-upgrade-crd
    tag: "v0.9.0-45e6e1c2"
    pullPolicy: IfNotPresent
  # Tolerations for CRD Upgrader Job pod
  tolerations:
    - operator: Exists
  # Node selector for CRD Upgrader Job pod
  nodeSelector: {}
