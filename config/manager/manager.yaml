apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: rbgs-controller
    app.kubernetes.io/name: rbgs
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: rbgs-controller
    app.kubernetes.io/name: rbgs
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: rbgs-controller
      app.kubernetes.io/name: rbgs
  replicas: 2
  template:
    metadata:
      labels:
        control-plane: rbgs-controller
        app.kubernetes.io/name: rbgs
    spec:
      serviceAccountName: controller-sa
      # The preStop sleep delays SIGTERM by 5s, so the webhooks keep serving
      # while the Pod leaves the webhook Service's endpoints. The grace period
      # covers that sleep plus the manager's 30s graceful shutdown (5 + 30).
      terminationGracePeriodSeconds: 35
      containers:
        - name: rbgs
          args:
            - --metrics-bind-address=:8443
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --feature-role-instance-lifecycle-hooks=false
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            # Needs /bin/sleep in the image. Switch to preStop.sleep once
            # Kubernetes 1.30 is the minimum.
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 1000m
              memory: 1536Mi
            requests:
              cpu: 100m
              memory: 256Mi
