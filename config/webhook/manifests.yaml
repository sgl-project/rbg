---
# Admission webhook configurations for the RoleBasedGroup admission webhooks.
#
# Service name and namespace below are Kustomize placeholders:
#   - namespace: system        → replaced with the Kustomize `namespace:` value
#                                (e.g. rbgs-system) by the namespace transformer.
#   - name: webhook-service    → prefixed with `namePrefix:` (e.g. rbgs-webhook-service)
#                                via the built-in nameReference transformer.
# Do NOT apply this file directly; always render with `kustomize build config/default`.
#
# caBundle is intentionally left empty. The in-cluster controller
# (WebhookCertReconciler) patches it at runtime using the self-signed CA generated
# by pkg/webhook.CertManager.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- name: vclusterengineruntimeprofile-v1alpha1-deprecation.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-clusterengineruntimeprofile
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - clusterengineruntimeprofiles
- name: vinstance-v1alpha1-deprecation.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-instance
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - instances
- name: vinstanceset-v1alpha1-deprecation.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-instanceset
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - instancesets
- name: vrolebasedgroup-v1alpha1-deprecation.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-rolebasedgroup
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - rolebasedgroups
- name: vrolebasedgroupscalingadapter-v1alpha1-deprecation.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-rolebasedgroupscalingadapter
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - rolebasedgroupscalingadapters
- name: vrolebasedgroupset-v1alpha1-deprecation.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-rolebasedgroupset
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - rolebasedgroupsets
- name: vrolebasedgroup.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha2-rolebasedgroup
  rules:
