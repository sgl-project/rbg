# Create [0,1,2]. To retire ordinal 1, set excluded-ordinals: "1" on
# this role and reduce replicas to 2 in one update (or set exclusions first).
# Wait for the child RIS to commit replicas=2 and committed-skip-ordinals="1".
# Then scale to 3 while keeping exclusions: the target becomes [0,2,3].
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: selective-scaling
  namespace: default
spec:
  roles:
    - name: worker
      replicas: 3
      podManagementPolicy: Parallel
      standalonePattern:
        template:
          spec:
            containers:
              - name: nginx
                image: nginx:1.27
