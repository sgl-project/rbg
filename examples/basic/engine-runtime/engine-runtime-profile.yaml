# Example: ClusterEngineRuntimeProfile with RoleBasedGroup (v1alpha2)
# ClusterEngineRuntimeProfile defines a cluster-scoped reusable sidecar/init-container profile
# that can be injected into role pods via the engineRuntimes field.
# Useful for injecting GPU drivers, monitoring sidecars, or shared runtime dependencies.
---
# Step 1: Create a ClusterEngineRuntimeProfile (cluster-scoped resource)
apiVersion: workloads.x-k8s.io/v1alpha2
kind: ClusterEngineRuntimeProfile
metadata:
  name: nvidia-runtime-profile
spec:
  initContainers:
    - name: gpu-driver-init
      image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
      command: ["/bin/sh", "-c", "echo 'GPU driver initialized'"]
      volumeMounts:
        - name: gpu-lib
          mountPath: /usr/local/lib/gpu
  containers:
    - name: gpu-monitor
      image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
      ports:
        - containerPort: 9090
          name: metrics
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
  volumes:
    - name: gpu-lib
      emptyDir: {}
  # containerPatches: the profile-side patch list — target-less RFC 6902
  # `add` ops, each firing at every targetContainers address the
  # referencing engineRuntimes[] entry lists, in list order. The profile
  # side may address /env, /volumeMounts and /command/0 only — /args and
  # capabilities are role-side-only roots. `/X/0` head-inserts stack with
  # the later rule leftmost, so a multi-element command prepend is written
  # in reverse (the rendered command below is
  # ["/opt/gpu/wrap", "exec", "nginx"]).
  containerPatches:
    - jsonPatch:
        op: add
        path: /command/0
        value: "exec"
    - jsonPatch:
        op: add
        path: /command/0
        value: "/opt/gpu/wrap"
    - jsonPatch:
        op: add
        path: /env/-
        value:
          name: GPU_WRAPPER_SITE
          value: /opt/gpu/site
    - jsonPatch:
        op: add
        path: /volumeMounts/-
        value:
          name: gpu-lib
          mountPath: /usr/local/lib/gpu

---
# Step 2: Create a RoleBasedGroup referencing the engine runtime profile
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: gpu-inference
  namespace: default
spec:
  roles:
    - name: prefill
      replicas: 2
      # engineRuntimes: reference the profile. component scopes the
      # reference to one component of the role's pattern; each
      # targetContainers entry names one container the reference touches —
      # the listing is the consent to the profile's containerPatches at
      # that container, and the entry's extraPatches carry the role's own
      # rules for the same container, landing after the profile's
      # (targetContainers requires component). Capabilities and args are
      # role-side-only roots, so the SYS_RESOURCE append lives here.
      engineRuntimes:
        - profileName: nvidia-runtime-profile
          component: worker
          targetContainers:
            - name: prefill-main
              extraPatches:
                - jsonPatch:
                    op: add
                    path: /securityContext/capabilities/add/-
                    value: SYS_RESOURCE
      leaderWorkerPattern:
        size: 2
        template:
          spec:
            containers:
              # A patch may only prepend to a declared command — creating one
              # would silently discard the image ENTRYPOINT — so declare it.
              - name: prefill-main
                image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
                command: ["nginx"]
                ports:
                  - containerPort: 8080
                resources:
                  requests:
                    nvidia.com/gpu: "1"
                  limits:
                    nvidia.com/gpu: "1"

    - name: decode
      replicas: 4
      engineRuntimes:
        - profileName: nvidia-runtime-profile
          component: worker
          targetContainers:
            - name: decode-main
              extraPatches:
                - jsonPatch:
                    op: add
                    path: /securityContext/capabilities/add/-
                    value: SYS_RESOURCE
      leaderWorkerPattern:
        size: 2
        template:
          spec:
            containers:
              - name: decode-main
                image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
                command: ["nginx"]
                ports:
                  - containerPort: 8081
                resources:
                  requests:
                    nvidia.com/gpu: "1"
                  limits:
                    nvidia.com/gpu: "1"
